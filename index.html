<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Estoque</title>
    <meta name="description" content="Sistema corporativo de alta performance para consulta de catálogo de estoque com busca inteligente, filtros por família, cascata de imagens e requisição via WhatsApp." />
    <meta property="og:title" content="Catálogo de Estoque" />
    <meta property="og:description" content="Sistema corporativo de alta performance para consulta de catálogo de estoque com busca inteligente, filtros por família, cascata de imagens e requisição via WhatsApp." />
    
    <!-- Puxa o ficheiro de estilos externo -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header-sticky">
      <div class="header-container">
        <div class="header-top">
          <!-- Logo (Esquerda) -->
          <div class="brand-icon-wrapper">
            <img src="/logo.png" alt="Cilex" class="brand-logo" onerror="this.style.display='none'">
          </div>
          
          <!-- Textos (Centro) -->
          <div class="header-brand-texts">
            <div class="brand-title">Catálogo de Estoque</div>
            <div class="brand-subtitle">Almoxarifado Cilex</div>
          </div>

          <!-- Busca -->
          <div class="search-wrapper">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" class="search-input" placeholder="Buscar por código, descrição... (Pressione /)" autocomplete="off">
            <button type="button" id="search-clear-btn" class="search-clear-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>

          <!-- Ações e Contador -->
          <div class="header-actions">
            <button type="button" id="btn-sync-api" class="action-icon-btn btn-sync" title="Forçar Atualização">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
            </button>
            <div id="items-counter" class="items-counter-badge">Carregando...</div>
            <button type="button" id="theme-toggle-btn" class="action-icon-btn btn-theme" title="Mudar Tema">
              <span id="theme-icon">🌙</span>
            </button>
          </div>
        </div>
          
        <!-- Carrossel de Categorias -->
        <div class="filter-carousel-wrapper">
          <button type="button" id="btn-scroll-left" class="carousel-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
          <nav id="filter-categories" class="filter-categories-container"></nav>
          <button type="button" id="btn-scroll-right" class="carousel-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="main-content">
      <div id="loading-state" class="loading-state">
        <div class="spinner"></div>
        <h2 class="state-title">A Sincronizar Catálogo...</h2>
        <p class="state-desc">A carregar itens da base de dados.</p>
      </div>
      <div id="empty-state" class="empty-state" style="display: none;">
        <h2 class="state-title">Nenhum item localizado</h2>
        <p class="state-desc">Tente outros termos ou redefina os filtros.</p>
      </div>
      <section id="products-grid" class="products-grid"></section>
      <div id="infinite-scroll-sentinel" style="display: none; padding: 20px; text-align: center; color: var(--text-muted);">
        A carregar mais itens...
      </div>
    </main>

    <!-- OVERLAYS -->
    <div id="toast-notification" class="toast-notification"></div>
    <div id="cloud-upload-overlay" class="cloud-upload-overlay">
      <div class="cloud-upload-card">
        <h3 class="cloud-upload-title">A Enviar Foto...</h3>
        <p id="cloud-upload-desc" style="color: var(--text-muted); font-size: 0.9rem;">A sincronizar com o Drive...</p>
        <div class="cloud-progress-bar"><div class="cloud-progress-fill"></div></div>
      </div>
    </div>

    <!-- Puxa o ficheiro de JavaScript externo -->
    <script src="script.js"></script>
  </body>
</html>
